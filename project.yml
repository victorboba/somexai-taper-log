name: TaperLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  TaperLog:
    type: application
    platform: iOS
    sources:
      - path: TaperLog
      - path: Shared
    dependencies:
      - target: TaperLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.taper-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: TaperLog/TaperLog.entitlements
    info:
      path: TaperLog/Info.plist
      properties:
        CFBundleDisplayName: Taper Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  TaperLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TaperLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.taper-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: TaperLogWidget/TaperLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: TaperLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Taper Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TaperLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaperLogTests
    dependencies:
      - target: TaperLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.taper-log.tests
        GENERATE_INFOPLIST_FILE: YES
  TaperLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaperLogUITests
    dependencies:
      - target: TaperLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.taper-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TaperLog
schemes:
  TaperLog:
    build:
      targets:
        TaperLog: all
        TaperLogTests: [test]
        TaperLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: TaperLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: TaperLog/StoreKit/Products.storekit
      targets:
        - TaperLogTests
        - TaperLogUITests
    archive:
      config: Release
